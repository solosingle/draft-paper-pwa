<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>草稿纸</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23fff'/%3E%3Cpath d='M4 20l4-1L20 7l-3-3L5 16l-1 4z' fill='none' stroke='%232f6fed' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fafaf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="草稿纸">
<style>
  :root{
    --bar-bg: rgba(250,250,248,.92);
    --bar-border: rgba(0,0,0,.08);
    --ink:#1f2328; --ink-dim:#8a8f98; --accent:#2f6fed;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f5f5f2; color:var(--ink); touch-action:none;}
  #board{position:fixed; inset:0; width:100vw; height:100vh;
    touch-action:none; display:block; background:#fff; cursor:crosshair;}

  .toolbar{position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    background:var(--bar-bg);
    backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid var(--bar-border);
    transition:transform .25s ease, opacity .25s ease;
    user-select:none; touch-action:manipulation;}
  .toolbar.hidden{transform:translateY(-110%); opacity:0; pointer-events:none;}

  .group{display:flex; align-items:center; gap:6px; padding:0 6px;}
  .group + .group{border-left:1px solid var(--bar-border);}

  .btn{width:44px; height:44px; border:none; background:transparent; border-radius:10px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--ink); transition:background .12s, transform .08s; touch-action:manipulation;}
  .btn:active{background:rgba(0,0,0,.1); transform:scale(.92);}
  .btn.active{background:rgba(47,111,237,.14); color:var(--accent);}
  .btn:disabled{opacity:.3; cursor:not-allowed;}
  .btn svg{width:22px; height:22px; pointer-events:none;}

  .swatch{position:relative; width:32px; height:32px; border-radius:50%;
    border:2px solid #fff; outline:1px solid rgba(0,0,0,.12);
    cursor:pointer; padding:0; touch-action:manipulation; transition:transform .08s;}
  .swatch:active{transform:scale(.88);}
  .swatch.active{outline:2px solid var(--accent); outline-offset:2px;}

  .size-wrap{display:flex; align-items:center; gap:8px; padding:0 8px;}
  .size-preview{width:22px; height:22px; border-radius:50%; background:var(--ink);
    display:flex; align-items:center; justify-content:center; flex:none;}
  .size-preview i{display:block; border-radius:50%; background:#fff;}
  input[type=range]{-webkit-appearance:none; appearance:none; width:110px; height:28px;
    background:transparent; outline:none; touch-action:manipulation;}
  input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:rgba(0,0,0,.15);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; margin-top:-8px;
    width:20px; height:20px; border-radius:50%; background:#fff;
    border:1px solid rgba(0,0,0,.2); box-shadow:0 1px 3px rgba(0,0,0,.2); cursor:pointer;}

  .show-tab{position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:9;
    width:44px; height:22px; border:none; border-radius:0 0 12px 12px;
    background:var(--bar-bg); backdrop-filter:blur(10px);
    border:1px solid var(--bar-border); border-top:none; color:var(--ink-dim);
    cursor:pointer; display:none; align-items:center; justify-content:center;}
  .toolbar.hidden ~ .show-tab{display:flex;}

  .bg-panel{position:fixed; top:62px; left:12px; z-index:15; display:none;
    width:208px; padding:12px;
    background:#fff; border:1px solid var(--bar-border); border-radius:14px;
    box-shadow:0 10px 34px rgba(0,0,0,.16);
    grid-template-columns:repeat(3,1fr); gap:10px; touch-action:manipulation;}
  .bg-panel.show{display:grid;}
  .thumb{position:relative; height:52px; border-radius:8px; cursor:pointer;
    border:1px solid rgba(0,0,0,.14); overflow:hidden; padding:0 0 3px;
    font-family:inherit; background-color:#fff;
    display:flex; align-items:flex-end; justify-content:center;}
  .thumb:active{transform:scale(.95);}
  .thumb.sel{outline:2px solid var(--accent); outline-offset:1px;}
  .thumb span{font-size:10px; color:#555; background:rgba(255,255,255,.75);
    padding:0 4px; border-radius:6px; line-height:14px;}
  .thumb.dots{background:#fff; background-image:radial-gradient(circle,#aab0b8 1px,transparent 1.2px);
    background-size:11px 11px;}
  .thumb.grid{background:#fff;
    background-image:linear-gradient(#c9ced6 1px,transparent 1px),linear-gradient(90deg,#c9ced6 1px,transparent 1px);
    background-size:12px 12px;}
  .thumb.lines{background:#fff;
    background-image:linear-gradient(#c9ced6 1px,transparent 1px);
    background-size:100% 13px; background-position:0 6px;}
  .thumb.blank{background:#fff;}
  .thumb.eye{background:#f6eed9;
    background-image:radial-gradient(circle,#b9ab86 1px,transparent 1.2px);
    background-size:11px 11px;}
  .thumb.tian{background:#fff;}
  .thumb.tian svg{position:absolute; inset:0; width:100%; height:100%;}

  #zoomBadge{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:8;
    font-size:12px; color:var(--ink-dim); background:rgba(255,255,255,.85);
    border:1px solid var(--bar-border); border-radius:20px; padding:5px 14px;
    pointer-events:none; opacity:0; transition:opacity .25s;}
  #zoomBadge.show{opacity:1;}

  @media (max-width:600px){
    input[type=range]{width:76px;}
    .btn{width:40px; height:40px;}
    .group{gap:3px; padding:0 4px;}
  }
</style>
</head>
<body>

<canvas id="board"></canvas>

<div class="toolbar" id="toolbar">
  <div class="group">
    <button class="btn active" data-tool="pen" title="笔">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
    </button>
    <button class="btn" data-tool="marker" title="荧光笔">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-4 4a2 2 0 0 0 0 3l1 1h2l2-2"/><path d="M14 4l6 6-8.5 8.5a2.5 2.5 0 0 1-3.5 0l-.5-.5"/><path d="M12 6l6 6"/></svg>
    </button>
    <button class="btn" data-tool="eraser" title="橡皮">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8L3 15a1.5 1.5 0 0 1 0-2l8-8a1.5 1.5 0 0 1 2 0l6 6a1.5 1.5 0 0 1 0 2l-7 7"/><path d="M6 12l6 6"/></svg>
    </button>
    <button class="btn" data-tool="pan" title="抓手（鼠标拖动平移）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6"/><path d="M11 11V4a1.5 1.5 0 0 1 3 0v7"/><path d="M14 11V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3 14a1.5 1.5 0 0 1 2.5-1.6L8 15"/></svg>
    </button>
  </div>

  <div class="group">
    <button class="btn" id="bgBtn" title="纸张背景">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
    </button>
  </div>

  <div class="group">
    <button class="swatch active" data-color="#1f2328" style="background:#1f2328"></button>
    <button class="swatch" data-color="#2f6fed" style="background:#2f6fed"></button>
    <button class="swatch" data-color="#e5484d" style="background:#e5484d"></button>
    <button class="swatch" data-color="#f5a623" style="background:#f5a623"></button>
    <button class="swatch" data-color="#30a46c" style="background:#30a46c"></button>
  </div>

  <div class="group size-wrap">
    <div class="size-preview"><i id="sizeDot" style="width:5px;height:5px;"></i></div>
    <input type="range" id="sizeRange" min="1" max="40" value="4">
  </div>

  <div class="group">
    <button class="btn" id="undoBtn" title="撤销" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="btn" id="redoBtn" title="重做" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
    </button>
    <button class="btn" id="resetBtn" title="回到原点">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
    </button>
    <button class="btn" id="clearBtn" title="清空">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>
    <button class="btn" id="saveBtn" title="导出当前视口 PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>
    <button class="btn" id="hideBtn" title="隐藏工具栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>
    </button>
  </div>
</div>

<button class="show-tab" id="showBtn" title="显示工具栏">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
</button>

<div class="bg-panel" id="bgPanel">
  <button type="button" class="thumb dots sel" data-bg="dots"><span>点阵</span></button>
  <button type="button" class="thumb grid" data-bg="grid"><span>方格</span></button>
  <button type="button" class="thumb lines" data-bg="lines"><span>横线</span></button>
  <button type="button" class="thumb blank" data-bg="blank"><span>空白</span></button>
  <button type="button" class="thumb tian" data-bg="tian">
    <svg viewBox="0 0 52 52" preserveAspectRatio="none">
      <rect x="2" y="2" width="48" height="48" fill="none" stroke="#c9ced6" stroke-width="1"/>
      <line x1="26" y1="2" x2="26" y2="50" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="2" y1="26" x2="50" y2="26" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 3"/>
    </svg><span>田字格</span>
  </button>
  <button type="button" class="thumb eye" data-bg="eye"><span>护眼</span></button>
</div>

<div id="zoomBadge">100%</div>

<script>
(function(){
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d', { desynchronized:true });
  var toolbar = document.getElementById('toolbar');
  var zoomBadge = document.getElementById('zoomBadge');
  var dpr = Math.max(1, window.devicePixelRatio || 1);

  var view = { x:0, y:0, scale:1 };
  var GRID = 34;
  var strokes = [];
  var current = null;
  var history = [], future = [];

  var state = { tool:'pen', color:'#1f2328', size:4, panMode:false, bg:'dots' };

  var activeTouches = new Map();
  var pinch = null;
  var rafQueued = false;

  function toWorld(sx, sy){
    return { x:(sx - view.x)/view.scale, y:(sy - view.y)/view.scale };
  }

  function resize(){
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    requestRender();
  }
  window.addEventListener('resize', resize);

  function requestRender(){
    if (rafQueued) return;
    rafQueued = true;
    requestAnimationFrame(function(){ rafQueued = false; render(); });
  }

  function render(){
    var w = canvas.width, h = canvas.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = state.bg === 'eye' ? '#f6eed9' : '#ffffff';
    ctx.fillRect(0,0,w,h);

    drawBackground();

    ctx.setTransform(dpr*view.scale, 0, 0, dpr*view.scale, dpr*view.x, dpr*view.y);
    for (var i=0;i<strokes.length;i++) drawStroke(strokes[i]);
    if (current) drawStroke(current);
  }

  function visibleWorld(){
    var s = view.scale;
    return { left:-view.x/s, top:-view.y/s,
      right:-view.x/s + innerWidth/s, bottom:-view.y/s + innerHeight/s, s:s };
  }

  function drawBackground(){
    var bg = state.bg;
    if (bg === 'blank') return;
    ctx.strokeStyle = bg === 'eye' ? '#b3a680' : '#cfd3da';
    ctx.fillStyle = bg === 'eye' ? '#b3a680' : '#cfd3da';
    ctx.lineWidth = 1;
    var v = visibleWorld(), g = GRID;
    if (bg === 'dots' || bg === 'eye'){
      var r = Math.max(0.8, 1.1);
      var x0 = Math.floor(v.left/g)*g, y0 = Math.floor(v.top/g)*g;
      ctx.beginPath();
      for (var x=x0; x<v.right; x+=g){
        for (var y=y0; y<v.bottom; y+=g){
          var sx = (x*v.s + view.x)*dpr, sy = (y*v.s + view.y)*dpr;
          ctx.moveTo(sx + r, sy);
          ctx.arc(sx, sy, r, 0, Math.PI*2);
        }
      }
      ctx.fill();
    } else if (bg === 'grid'){
      ctx.beginPath();
      var gx0 = Math.floor(v.left/g)*g;
      for (var gx=gx0; gx<v.right; gx+=g){
        var px = (gx*v.s + view.x)*dpr;
        ctx.moveTo(px,0); ctx.lineTo(px, canvas.height);
      }
      var gy0 = Math.floor(v.top/g)*g;
      for (var gy=gy0; gy<v.bottom; gy+=g){
        var py = (gy*v.s + view.y)*dpr;
        ctx.moveTo(0,py); ctx.lineTo(canvas.width, py);
      }
      ctx.stroke();
    } else if (bg === 'lines'){
      ctx.beginPath();
      var ly0 = Math.floor(v.top/g)*g;
      for (var ly=ly0; ly<v.bottom; ly+=g){
        var lpy = (ly*v.s + view.y)*dpr;
        ctx.moveTo(0,lpy); ctx.lineTo(canvas.width, lpy);
      }
      ctx.stroke();
    } else if (bg === 'tian'){
      var T = g*4;
      var tx0 = Math.floor(v.left/T)*T, ty0 = Math.floor(v.top/T)*T;
      for (var cx=tx0; cx<v.right; cx+=T){
        for (var cy=ty0; cy<v.bottom; cy+=T){
          var bx = (cx*v.s + view.x)*dpr, by = (cy*v.s + view.y)*dpr;
          var bs = T*v.s*dpr;
          ctx.setLineDash([]);
          ctx.beginPath(); ctx.rect(bx,by,bs,bs); ctx.stroke();
          ctx.setLineDash([6,5]);
          ctx.beginPath();
          ctx.moveTo(bx+bs/2,by); ctx.lineTo(bx+bs/2,by+bs);
          ctx.moveTo(bx,by+bs/2); ctx.lineTo(bx+bs,by+bs/2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }
  }

  function segWidth(stroke, pt, pointerType){
    if (stroke.tool === 'eraser') return Math.max(8, stroke.size*3);
    if (stroke.tool === 'marker') return stroke.size*2.2;
    var f = (pointerType==='pen') ? (0.35 + pt.p*1.3) : 1;
    return Math.max(0.5, stroke.size*f);
  }

  function drawStroke(stroke){
    var pts = stroke.points;
    ctx.globalCompositeOperation = stroke.tool==='eraser' ? 'destination-out' : 'source-over';
    ctx.globalAlpha = stroke.tool==='marker' ? 0.35 : 1;
    ctx.strokeStyle = stroke.color;
    ctx.fillStyle = stroke.color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (pts.length === 1){
      var w0 = segWidth(stroke, pts[0], 'pen');
      ctx.beginPath();
      ctx.arc(pts[0].x, pts[0].y, w0/2, 0, Math.PI*2);
      ctx.fill();
      resetCtx();
      return;
    }
    for (var i=1;i<pts.length;i++){
      var prev = pts[i-1], cur = pts[i], pp = pts[i-2] || prev;
      var mid = { x:(prev.x+cur.x)/2, y:(prev.y+cur.y)/2 };
      var prevMid = { x:(pp.x+prev.x)/2, y:(pp.y+prev.y)/2 };
      ctx.beginPath();
      ctx.lineWidth = segWidth(stroke, cur, 'pen');
      ctx.moveTo(prevMid.x, prevMid.y);
      ctx.quadraticCurveTo(prev.x, prev.y, mid.x, mid.y);
      ctx.stroke();
    }
    resetCtx();
  }
  function resetCtx(){
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function commit(stroke){
    history.push(strokes);
    if (history.length > 50) history.shift();
    strokes = strokes.concat([stroke]);
    future = [];
    updateButtons();
  }
  function updateButtons(){
    document.getElementById('undoBtn').disabled = history.length === 0;
    document.getElementById('redoBtn').disabled = future.length === 0;
  }

  function penDown(e){
    var w = toWorld(e.clientX, e.clientY);
    current = {
      tool: state.tool, color: state.color, size: state.size,
      points: [ { x:w.x, y:w.y, p:(e.pressure||0.5) } ],
      sx:w.x, sy:w.y
    };
    requestRender();
  }
  function penMove(e){
    if (!current) return;
    var w = toWorld(e.clientX, e.clientY);
    var a = 0.55;
    current.sx += (w.x - current.sx)*a;
    current.sy += (w.y - current.sy)*a;
    var sp = e.pressure || 0.5;
    var last = current.points[current.points.length-1];
    var ps = last.p + (sp - last.p)*0.4;
    current.points.push({ x:current.sx, y:current.sy, p:ps });
    requestRender();
  }
  function penUp(){
    if (current){
      commit(current);
      current = null;
      requestRender();
    }
  }

  function touchDown(e){
    activeTouches.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (activeTouches.size === 2){
      startPinch();
    }
  }
  function touchMove(e){
    if (!activeTouches.has(e.pointerId)) return;
    activeTouches.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if (activeTouches.size === 1 && !pinch){
      var last = touchMove._last;
      if (last){
        view.x += e.clientX - last.x;
        view.y += e.clientY - last.y;
      }
      touchMove._last = { x:e.clientX, y:e.clientY };
      showZoom();
      requestRender();
    } else if (activeTouches.size >= 2 && pinch){
      applyPinch();
    }
  }
  function touchUp(e){
    activeTouches.delete(e.pointerId);
    touchMove._last = null;
    if (activeTouches.size < 2){ pinch = null; }
    if (activeTouches.size === 1){
      var only = activeTouches.values().next().value;
      touchMove._last = { x:only.x, y:only.y };
    }
  }

  function startPinch(){
    var ids = Array.from(activeTouches.keys());
    var a = activeTouches.get(ids[0]), b = activeTouches.get(ids[1]);
    var dist = Math.hypot(a.x-b.x, a.y-b.y);
    var mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
    var anchor = toWorld(mid.x, mid.y);
    pinch = { startDist:dist, startScale:view.scale, anchor:anchor };
    touchMove._last = null;
  }
  function applyPinch(){
    var ids = Array.from(activeTouches.keys());
    var a = activeTouches.get(ids[0]), b = activeTouches.get(ids[1]);
    var dist = Math.hypot(a.x-b.x, a.y-b.y);
    var mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
    var ratio = dist / pinch.startDist;
    var ns = pinch.startScale * Math.pow(ratio, 0.55);
    ns = Math.min(2.5, Math.max(0.4, ns));
    view.scale = ns;
    view.x = mid.x - pinch.anchor.x*ns;
    view.y = mid.y - pinch.anchor.y*ns;
    showZoom();
    requestRender();
  }

  var zoomTimer;
  function showZoom(){
    zoomBadge.textContent = Math.round(view.scale*100) + '%';
    zoomBadge.classList.add('show');
    clearTimeout(zoomTimer);
    zoomTimer = setTimeout(function(){ zoomBadge.classList.remove('show'); }, 900);
  }

  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    if (e.pointerType === 'touch' || state.panMode){
      touchDown(e);
    } else {
      penDown(e);
    }
  });
  canvas.addEventListener('pointermove', function(e){
    e.preventDefault();
    if (e.pointerType === 'touch' || state.panMode){
      touchMove(e);
    } else {
      penMove(e);
    }
  });
  function onUp(e){
    if (e.pointerType === 'touch' || state.panMode){
      touchUp(e);
    } else {
      penUp();
    }
  }
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function onTap(el, fn){
    el.addEventListener('pointerdown', function(e){
      if (e.pointerType==='mouse' && e.button!==0) return;
      e.preventDefault(); fn(e);
    });
  }

  var bgPanel = document.getElementById('bgPanel');
  var bgBtn = document.getElementById('bgBtn');
  onTap(bgBtn, function(){
    bgPanel.classList.toggle('show');
  });
  document.querySelectorAll('.thumb').forEach(function(thumb){
    onTap(thumb, function(){
      document.querySelectorAll('.thumb').forEach(function(t){ t.classList.remove('sel'); });
      thumb.classList.add('sel');
      state.bg = thumb.dataset.bg;
      requestRender();
      setTimeout(function(){ bgPanel.classList.remove('show'); }, 120);
    });
  });
  document.addEventListener('pointerdown', function(e){
    if (!bgPanel.classList.contains('show')) return;
    if (e.target === bgPanel || bgPanel.contains(e.target) || e.target === bgBtn) return;
    if (bgBtn.contains(e.target)) return;
    bgPanel.classList.remove('show');
  });

  document.querySelectorAll('[data-tool]').forEach(function(btn){
    onTap(btn, function(){
      var t = btn.dataset.tool;
      if (t === 'pan'){
        state.panMode = !state.panMode;
        btn.classList.toggle('active', state.panMode);
        canvas.style.cursor = state.panMode ? 'grab' : 'crosshair';
        return;
      }
      state.panMode = false;
      document.querySelector('[data-tool="pan"]').classList.remove('active');
      document.querySelectorAll('[data-tool]').forEach(function(b){
        if (b.dataset.tool !== 'pan') b.classList.remove('active');
      });
      btn.classList.add('active');
      state.tool = t;
      canvas.style.cursor = 'crosshair';
    });
  });

  document.querySelectorAll('.swatch').forEach(function(sw){
    onTap(sw, function(){
      document.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('active'); });
      sw.classList.add('active');
      state.color = sw.dataset.color;
      document.querySelector('.size-preview').style.background = state.color;
    });
  });

  var sizeRange = document.getElementById('sizeRange');
  var sizeDot = document.getElementById('sizeDot');
  function syncSize(){
    state.size = parseInt(sizeRange.value, 10);
    var d = Math.max(3, Math.min(18, state.size*0.9));
    sizeDot.style.width = d+'px'; sizeDot.style.height = d+'px';
  }
  sizeRange.addEventListener('input', syncSize);
  syncSize();

  onTap(document.getElementById('undoBtn'), function(){
    if (!history.length) return;
    future.push(strokes);
    strokes = history.pop();
    updateButtons(); requestRender();
  });
  onTap(document.getElementById('redoBtn'), function(){
    if (!future.length) return;
    history.push(strokes);
    strokes = future.pop();
    updateButtons(); requestRender();
  });
  onTap(document.getElementById('resetBtn'), function(){
    view.x = 0; view.y = 0; view.scale = 1;
    showZoom(); requestRender();
  });
  onTap(document.getElementById('clearBtn'), function(){
    history.push(strokes);
    strokes = []; future = [];
    updateButtons(); requestRender();
  });
  onTap(document.getElementById('saveBtn'), function(){
    requestRender();
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.download = '草稿-' + stamp + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
  onTap(document.getElementById('hideBtn'), function(){ toolbar.classList.add('hidden'); });
  onTap(document.getElementById('showBtn'), function(){ toolbar.classList.remove('hidden'); });

  resize();

  if ('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
